<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course programme</title>
<link rel="stylesheet" href="assets/css/brand.css"><link rel="stylesheet" href="assets/css/base.css"></head><body><main><h1>Course Programme</h1>
<p>Twenty weekly units over five months, in three cycles. The heritage themes begin in Week 1 at B1 and return at higher levels. <b>Only units marked “Available” are ready; the others are planned and not yet developed.</b></p><div id="p">Loading…</div></main>
<script src="assets/js/app.js"></script><script>shell('Programme');
J('content/programme.json').then(d=>{$('#p').innerHTML=d.cycles.map(c=>`<h2>${c.name}</h2><div style="overflow-x:auto"><table><tr><th>Week</th><th>Theme</th><th>Level</th><th>Main grammar</th><th>Status</th></tr>${c.units.map(u=>`<tr><td>${u.w}</td><td>${u.ok?`<a href="unit.html?u=${String(u.w).padStart(2,'0')}">${u.t}</a>`:u.t}</td><td>${u.l}</td><td>${u.g}</td><td><span class="tag${u.ok?'':' soon'}">${u.ok?'Available':'Planned'}</span></td></tr>`).join('')}</table></div>`).join('')}).catch(()=>$('#p').textContent='The programme could not be loaded. If you opened this file directly, use a web server or GitHub Pages.')</script></body></html>
